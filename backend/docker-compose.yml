version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: library-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - library-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: library-auth-service
    restart: always
    ports:
      - "8081:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/library_management
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-2024
      - JWT_EXPIRE=24h
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - library-network

  # Catalog Service
  catalog-service:
    build: ./catalog-service
    container_name: library-catalog-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/library_management
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - library-network

  # Loan Service
  loan-service:
    build: ./loan-service
    container_name: library-loan-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb:27017/library_management
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - LOAN_PERIOD_DAYS=14
      - FINE_PER_DAY=0.50
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - library-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: library-api-gateway
    restart: always
    ports:
      - "8000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-2024
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - LOAN_SERVICE_URL=http://loan-service:3003
    depends_on:
      - auth-service
      - catalog-service
      - loan-service
    networks:
      - library-network

networks:
  library-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
